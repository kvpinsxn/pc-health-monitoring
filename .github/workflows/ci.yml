name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: ruff check app

      - name: Run mypy
        run: mypy app

      - name: Run Bandit
        run: bandit -r app -x app/tests

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Validate Compose configuration
        run: GRAFANA_ADMIN_PASSWORD=ci-test-password docker compose config --quiet

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag pc-health:${{ github.sha }} .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: pc-health:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
